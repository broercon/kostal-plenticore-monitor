<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anmelden – Kostal Plenticore Monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body class="login-body">
<div class="login-card">
  <h1>Kostal Plenticore Monitor</h1>
  <p class="muted">Bitte anmelden, um die Daten zu sehen.</p>
  <form id="login-form">
    <label for="username">Benutzername</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus />

    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />

    <button type="submit" id="login-submit">Anmelden</button>
    <p class="login-error muted" id="login-error"></p>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
