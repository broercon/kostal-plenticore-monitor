name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Die Anwendung speichert ausschliesslich in PostgreSQL, die Tests
    # brauchen deshalb eine echte Instanz (siehe docs/DEVELOPMENT.md). Der
    # Health-Check sorgt dafuer, dass der erste Test nicht gegen eine noch
    # startende Datenbank laeuft.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kostal_app
          POSTGRES_PASSWORD: kostal_app
          POSTGRES_DB: kostal_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kostal_app -d kostal_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://kostal_app:kostal_app@localhost:5432/kostal_app_test
        run: python -m pytest tests/ -v

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --file backend/Dockerfile .
