services:
  kostal-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kostal-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # PFLICHT. Fertiger Connection-String der PostgreSQL-Datenbank, z.B.
      #   DATABASE_URL=postgresql://kostal_app:...@postgres:5432/kostal_app
      # Der Datenbank-Host ist ueber das Netzwerk "dbnet" erreichbar (siehe
      # unten). Ohne diese Variable bricht die Anwendung beim Start mit
      # einer entsprechenden Meldung ab.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL muss in .env gesetzt sein}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-15}
      - TIMEZONE=${TIMEZONE:-Europe/Berlin}
      - AUTO_IMPORT_HISTORY=${AUTO_IMPORT_HISTORY:-true}
      - AUTO_IMPORT_DAYS=${AUTO_IMPORT_DAYS:-35}
      - GRID_POWER_INVERTED=${GRID_POWER_INVERTED:-false}
      - DAILY_REPORT_ENABLED=${DAILY_REPORT_ENABLED:-true}
      - DAILY_REPORT_TIME=${DAILY_REPORT_TIME:-19:00}
      - DAILY_REPORT_RECIPIENTS=${DAILY_REPORT_RECIPIENTS:-}
      - MAIL_SERVICE_URL=${MAIL_SERVICE_URL:-}
      - MAIL_SERVICE_API_KEY=${MAIL_SERVICE_API_KEY:-}
      - MAIL_SERVICE_FROM_NAME=${MAIL_SERVICE_FROM_NAME:-Kostal Plenticore Monitor}
    volumes:
      # Enthaelt nur noch die Logdateien - die Messwerte liegen in der
      # Datenbank.
      - ./data:/app/data
      - ./config/inverters.json:/app/config/inverters.json:ro

    networks:
      - dbnet

networks:
  # Gemeinsames Netzwerk des PostgreSQL-Stacks. Wird dort angelegt, hier
  # nur mitbenutzt - darueber ist der Datenbank-Container unter dem Namen
  # "postgres" erreichbar. Wer die Datenbank anders betreibt, passt Namen
  # und Adresse hier und in DATABASE_URL an.
  dbnet:
    external: true
    name: dbnet
