services:
  kostal-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kostal-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-15}
      - TIMEZONE=${TIMEZONE:-Europe/Berlin}
      - AUTO_IMPORT_HISTORY=${AUTO_IMPORT_HISTORY:-true}
      - AUTO_IMPORT_DAYS=${AUTO_IMPORT_DAYS:-7}
      - GRID_POWER_INVERTED=${GRID_POWER_INVERTED:-false}
    volumes:
      - ./data:/app/data
      - ./config/inverters.json:/app/config/inverters.json:ro
